name: Keep dashboard awake

on:
  schedule:
    # Sundays, every 10 minutes from 15:00-19:50 UTC.
    # This covers 8:00am-12:50pm PDT and 7:00am-11:50am PST.
    - cron: "*/10 15-19 * * 0"
    # One-time evening window through 11:00pm PDT on September 17, 2026.
    - cron: "*/10 1-5 18 9 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Render service
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_SCHEDULE" = "*/10 1-5 18 9 *" ] && [ "$(TZ=America/Los_Angeles date +%F)" != "2026-09-17" ]; then
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 90 \
            https://dog-shelter-walks.onrender.com/api/health
