name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Copy dog photos into published site
        run: |
          mkdir -p public/dog-photos
          for photo in aspen bowie delilah duke fable klaus max pixie prissy ricky snowcone tonto; do
            if [ -f "$photo.png" ]; then cp "$photo.png" "public/dog-photos/$photo.png"; fi
          done
      - name: Verify published dog photos
        run: |
          for photo in aspen bowie delilah duke fable klaus max pixie prissy ricky snowcone tonto; do
            test -s "public/dog-photos/$photo.png" || { echo "::error::Missing public/dog-photos/$photo.png"; exit 1; }
          done
          ls -lh public/dog-photos/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
