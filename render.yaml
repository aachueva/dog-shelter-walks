services:
  - type: web
    name: dog-shelter-walks
    runtime: python
    plan: free
    buildCommand: echo "No build step required"
    startCommand: python3 server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: CURRENT_DOGS_TAB
        value: Current Dogs
      - key: SHAREPOINT_ROSTER_URL
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: WALKS_TAB
        value: Walks
      - key: DAILY_PRIORITY_COUNT
        value: "3"
      - key: DATA_CACHE_SECONDS
        value: "300"
      - key: SHELTER_TIMEZONE
        value: America/Los_Angeles
