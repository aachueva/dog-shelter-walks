<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ee" />
    <title>Dogs to Walk Today</title>
    <link rel="stylesheet" href="/styles.css?v=20260918-1" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <p class="eyebrow">Shelter walk team</p>
          <h1>Dogs to walk today</h1>
          <p id="today-label" class="subtitle">Loading today’s priorities…</p>
        </div>
        <button id="refresh-btn" class="refresh" type="button" aria-label="Refresh walk data">
          Refresh
        </button>
      </header>

      <div id="status-banner" class="status hidden" role="status"></div>

      <section id="priority-section" aria-labelledby="priority-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Start here</p>
            <h2 id="priority-title">Top priority</h2>
          </div>
          <span id="priority-count" class="count-pill"></span>
        </div>
        <div id="priority-grid" class="priority-grid loading-grid" aria-live="polite"></div>
      </section>

      <section class="summary" aria-label="Today’s walk summary">
        <article><strong id="walks-today">—</strong><span>Walks today</span></article>
        <article><strong id="walked-today">—</strong><span>Dogs walked</span></article>
        <article><strong id="need-walk">—</strong><span>Still need a walk</span></article>
      </section>

      <section class="panel" aria-labelledby="other-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Full roster</p>
            <h2 id="other-title">Other dogs</h2>
          </div>
          <span id="roster-count" class="count-pill"></span>
        </div>
        <div id="other-list" class="dog-list"></div>
      </section>

      <section class="panel heatmap-panel" aria-labelledby="heatmap-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Recent activity</p>
            <h2 id="heatmap-title">Last 14 days</h2>
          </div>
          <p class="legend"><span></span>More walks</p>
        </div>
        <div class="heatmap-scroll">
          <div id="walk-heatmap" class="heatmap"></div>
        </div>
        <p class="scroll-hint">Swipe sideways to see all days.</p>
      </section>

      <footer>
        <span id="last-updated">Not updated yet</span>
        <span>Data refreshes every 5 minutes</span>
      </footer>
    </main>
    <script type="module" src="/app.js?v=20260918-1"></script>
  </body>
</html>
